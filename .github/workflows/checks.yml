name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DEEPSEEK_API_KEY: ""
      TUDOU_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Check tracked source and export safeguards
        run: |
          python scripts/check_source.py --tracked
          python scripts/test_source_tools.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Python tests
        run: python -m pytest -q
      - name: Frontend offline tests
        run: node --test tests/frontend_*.mjs frontend/tests/*.test.mjs
      - name: Production frontend build
        run: npm run build --prefix frontend
