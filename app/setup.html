<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>映作 · 本地连接设置</title>
<style>body{background:#101114;color:#eaeaea;font:16px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;margin:0}main{max-width:620px;margin:8vh auto;padding:32px}h1{font-size:30px}p{color:#aeb1bc}label{display:block;margin:22px 0 6px}input{box-sizing:border-box;width:100%;padding:13px;background:#1d2028;border:1px solid #424958;border-radius:10px;color:#fff;font:inherit}button{margin-top:25px;padding:12px 25px;border:0;border-radius:10px;background:#cab4fc;color:#201433;font:inherit;cursor:pointer}a{color:#cab4fc}#status{min-height:30px}</style>
<main><a href="/">← 回到工作台</a><h1>连接你的模型服务</h1><p>密钥只保存在本机项目的 .env 中，后端使用；不会回显到网页或写入版本控制。留空表示保留已配置的密钥。</p><p>当前脚本策划：__PLANNER_LABEL__</p><form id="setup"><div __DEEPSEEK_HIDDEN__><label for="deepseek">DeepSeek API Key</label><input id="deepseek" type="password" autocomplete="off" placeholder="粘贴 DeepSeek Key"></div><label for="tudou">土豆 API Key</label><input id="tudou" type="password" autocomplete="off" placeholder="粘贴 default 分组 Key"><p>土豆 Key 需要允许当前使用的模型；策划选择土豆时，还需允许上方显示的文本模型。图片与视频继续使用 GPT Image 2 与 Wan 3.0。商品直接使用上传原图，每次先生成1张场景图。确认图片后，按所选10至60秒时长制作视频（最多6段），声音由视频模型生成。恢复旧任务需要使用原账户的 Key；更换账户后可能无法查询旧任务。</p><button type="submit">保存到本机</button></form><p id="status" role="status"></p></main>
<script>document.getElementById('setup').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('status');out.textContent='正在保存…';try{const r=await fetch('/api/settings/credentials',{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Token':'__SETUP_TOKEN__'},body:JSON.stringify({deepseek_api_key:document.getElementById('deepseek').value,tudou_api_key:document.getElementById('tudou').value})});const j=await r.json();if(!r.ok)throw Error(j.detail);document.getElementById('setup').reset();out.textContent='已保存。脚本策划 '+(j.configured.planner?'已配置':'未配置')+'，图片与视频 '+(j.configured.video?'已配置':'未配置')+'。可返回工作台开始制作。'}catch(err){out.textContent=err.message}})</script></html>
